name: Full Regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-regression:
    name: Full Regression (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
