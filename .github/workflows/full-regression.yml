name: Full Regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-regression:
    name: Full Regression (Node 20, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci
      - name: Show Firestore declaration tree
        run: |
          node --version
          npm --version
          find . -type d -path '*/node_modules/@google-cloud/firestore' -print
          find . -type f -path '*/node_modules/@google-cloud/firestore/types/firestore.d.ts' -print
      - run: npm run build
