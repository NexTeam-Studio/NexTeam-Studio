<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NexOps Branding Stack Proof</title>
  <link rel="stylesheet" href="../../../apps/web/src/styles.css" />
  <style>
    body {
      margin: 0;
      background: #edf3e7;
    }
  </style>
</head>
<body>
  <main class="nexops-app" style="--nexops-brand-primary:#0c1118;--nexops-brand-accent:#A8E600;--nexops-brand-gradient:linear-gradient(135deg,#D4FF20 0%,#25D238 100%);--nexops-brand-background:#f5f7f1;--nexops-brand-surface:#ffffff;--nexops-brand-text:#101822;--nexops-brand-muted:#68717c;--nexops-font-family:Montserrat, Aptos, Segoe UI, Helvetica Neue, sans-serif;">
    <aside class="nexops-app-sidebar" aria-label="NexOps navigation">
      <div class="nexops-app-logo">
        <div class="nexops-sidebar-brand-stack" aria-label="NexOps brand stack">
          <div class="nexops-sidebar-brand-tier">
            <img alt="Nexi" class="product-logo product-logo-nexi nexops-sidebar-brand-logo nexops-sidebar-brand-logo-nexi" src="../../../apps/web/public/assets/brand/nexi-logo.png" />
          </div>
          <div class="nexops-sidebar-brand-tier">
            <img alt="NexOps" class="product-logo product-logo-nexops nexops-sidebar-brand-logo nexops-sidebar-brand-logo-product" src="../../../apps/web/public/assets/brand/nexops-logo.png" />
          </div>
          <div class="nexops-sidebar-brand-tier nexops-sidebar-brand-tier-tenant">
            <img alt="Aquatrace logo" class="tenant-logo nexops-sidebar-tenant-mark" src="../../../apps/web/public/tenants/aquatrace/aquatrace-banner-logo.png" />
          </div>
        </div>
      </div>
      <button class="nexops-create-button" type="button">Create</button>
      <nav class="nexops-nav">
        <button type="button">Home</button>
        <button class="active" type="button">Clients</button>
        <button type="button">Requests</button>
        <button type="button">Quotes</button>
        <button type="button">Schedule</button>
        <button type="button">Jobs</button>
        <button type="button">Invoices</button>
      </nav>
    </aside>
    <section class="nexops-web-main">
      <header class="nexops-web-topbar">
        <div class="nexops-web-brand">
          <img alt="NexOps" class="product-logo product-logo-nexops nexops-header-product-logo" src="../../../apps/web/public/assets/brand/nexops-logo.png" />
          <div class="nexops-web-brand-copy">
            <strong>NexOps</strong>
            <span>Aquatrace</span>
          </div>
        </div>
        <div class="nexops-web-tools">
          <label><input placeholder="Search NexOps..." /></label>
          <span>Clients</span>
        </div>
      </header>
      <section class="nexops-module-page">
        <article class="nexops-module-card wide">
          <p class="eyebrow">Proof screen</p>
          <h2>Clients workspace</h2>
          <p>This receipt render proves the centered three-tier sidebar stack on the NexOps shell using the live logo assets and current CSS.</p>
        </article>
      </section>
    </section>
  </main>
</body>
</html>
